# =============================================================================
# DEV override — hot-reload, exposed ports, source mounts
# =============================================================================
# Usage (via deploy.ps1):
#   .\deploy.ps1 -Env dev
# Or manually:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up
# =============================================================================
version: '3.8'

services:

  db:
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  # ---------------------------------------------------------------------------
  # Seed runner — creates initial winery + admin user (idempotent, dev only)
  # Reuses Dockerfile.migrate image; runs once after migrations complete.
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command: python -m scripts.seed_initial_data
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  fermentation:
    ports:
      - "${FERMENTATION_HOST_PORT:-8000}:8000"
    # Hot-reload: mount source so code changes are picked up instantly
    volumes:
      - ./src:/app/src
      - ./src/shared:/app/src/shared
    command: >
      uvicorn src.modules.fermentation.src.main:app
      --host 0.0.0.0 --port 8000 --reload
    depends_on:
      seed:
        condition: service_completed_successfully

  winery:
    ports:
      - "${WINERY_HOST_PORT:-8001}:8001"
    volumes:
      - ./src:/app/src
      - ./src/shared:/app/src/shared
    command: >
      uvicorn src.modules.winery.src.main:app
      --host 0.0.0.0 --port 8001 --reload
    depends_on:
      seed:
        condition: service_completed_successfully

  fruit_origin:
    ports:
      - "${FRUIT_ORIGIN_HOST_PORT:-8002}:8002"
    volumes:
      - ./src:/app/src
      - ./src/shared:/app/src/shared
    command: >
      uvicorn src.modules.fruit_origin.src.main:app
      --host 0.0.0.0 --port 8002 --reload
    depends_on:
      seed:
        condition: service_completed_successfully

  analysis_engine:
    ports:
      - "${ANALYSIS_ENGINE_HOST_PORT:-8003}:8003"
    volumes:
      - ./src:/app/src
      - ./src/shared:/app/src/shared
    command: >
      uvicorn src.modules.analysis_engine.src.main:app
      --host 0.0.0.0 --port 8003 --reload
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      INTERNAL_FERMENTATION_API_URL: http://fermentation:8000
      INTERNAL_WINERY_API_URL: http://winery:8001
      INTERNAL_FRUIT_ORIGIN_API_URL: http://fruit_origin:8002
      INTERNAL_ANALYSIS_API_URL: http://analysis_engine:8003
      NEXT_PUBLIC_FERMENTATION_API_URL: ${NEXT_PUBLIC_FERMENTATION_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WINERY_API_URL: ${NEXT_PUBLIC_WINERY_API_URL:-http://localhost:8001}
      NEXT_PUBLIC_FRUIT_ORIGIN_API_URL: ${NEXT_PUBLIC_FRUIT_ORIGIN_API_URL:-http://localhost:8002}
      NEXT_PUBLIC_ANALYSIS_API_URL: ${NEXT_PUBLIC_ANALYSIS_API_URL:-http://localhost:8003}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      fermentation:
        condition: service_healthy
      winery:
        condition: service_healthy
      fruit_origin:
        condition: service_healthy
      analysis_engine:
        condition: service_healthy
